[project]
name = "openclaw-fastapi"
version = "0.1.0"
description = "FastAPI implementation of openclaw agent interaction loop"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "pymysql>=1.1.1",
    "redis>=5.0.0",
    "sse-starlette>=1.8.0",
    "python-multipart>=0.0.6",
    "jsonschema>=4.25.1",
    "sqlglot>=27.0.0",
    "docling>=2.69.1",
    "onnxruntime>=1.20.1",
    "minio>=7.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
